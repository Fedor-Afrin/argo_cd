apiVersion: v1
kind: Secret
metadata:
  name: sd-db-secret
type: Opaque
stringData:
  # Замените значение на реальную строку подключения перед применением,
  # например: postgresql://postgres:СЕКРЕТ@sd-db-service:5432/service_desk_db
  DATABASE_URL: "postgresql://postgres:password@sd-db-service:5432/service_desk_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sd-api
  labels:
    app: sd-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sd-api
  template:
    metadata:
      labels:
        app: sd-api
    spec:
      containers:
      - name: sd-api
        image: fedorafrin85/service-desk-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sd-db-secret
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sd-api-service
spec:
  selector:
    app: sd-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP